<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Manager - Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            opacity: 0.6;
        }
        h1 {
            color: #1e293b;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }
        p {
            color: #64748b;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .button {
            background-color: #1a9b8e;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        .button:hover {
            background-color: #16857a;
        }
        .status {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #fef3c7;
            border-radius: 0.5rem;
            color: #92400e;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192L5.636 18.364M12 2.25a9.75 9.75 0 11-9.75 9.75 9.75 9.75 0 019.75-9.75z"></path>
        </svg>
        
        <h1>You're Offline</h1>
        <p>Store Manager is available offline, but some features may be limited. Your data is safely stored locally.</p>
        
        <button class="button" onclick="tryReconnect()">Try Again</button>
        
        <div class="status" id="status" style="display: none;">
            Checking connection...
        </div>
    </div>

    <script>
        function tryReconnect() {
            const status = document.getElementById('status');
            status.style.display = 'block';
            status.textContent = 'Checking connection...';
            
            // Try to reload the main app
            setTimeout(() => {
                if (navigator.onLine) {
                    window.location.href = '/';
                } else {
                    status.textContent = 'Still offline. Please check your internet connection.';
                    setTimeout(() => {
                        status.style.display = 'none';
                    }, 3000);
                }
            }, 1000);
        }

        // Auto-redirect when back online
        window.addEventListener('online', () => {
            window.location.href = '/';
        });

        // Check connection status periodically
        setInterval(() => {
            if (navigator.onLine) {
                window.location.href = '/';
            }
        }, 5000);
    </script>
</body>
</html>
